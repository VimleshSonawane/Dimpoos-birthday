<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poonam: slides 1 and 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:"Shippori Mincho","Yu Mincho",Georgia,serif;--hand:"Caveat","Segoe Script",cursive;--paper:#FFF8F0;--bar:7vh}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--paper);font-family:var(--serif);overflow:hidden}
#deck{height:100vh;height:100svh;overflow-y:scroll;scroll-snap-type:y mandatory}
.slide{position:relative;height:100vh;height:100svh;scroll-snap-align:start;overflow:hidden;background:#000}
.shot{display:none;position:absolute;inset:0;opacity:0;z-index:0;transition:opacity 2.4s cubic-bezier(.4,0,.2,1)}
.shot.pre,.shot.on,.shot.leaving{display:block}
.shot.on{opacity:1;z-index:2}
/* true cross-dissolve: the outgoing shot stays fully visible underneath (still pushing forward) while the new one fades in on top */
.shot.leaving{opacity:1;z-index:1;transition:none}
.shot svg{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 55%}
/* ===== 3D camera rig =====
   .shot  -> perspective (the lens)
   .push  -> push-through-depth dissolve between shots
   .ant   -> anticipation (tiny lean back before big moments)
   .foc   -> focus pulls (town -> lit window)
   .cam   -> the camera move for the shot
   .ly-*  -> far / mid / main / near layers at real Z depth, scaled back so the frame looks the same at rest */
.shot{perspective:1100px;perspective-origin:50% 50%}
.push,.ant,.foc,.cam{position:absolute;inset:0;transform-style:preserve-3d}
.ly{position:absolute;inset:-10%;pointer-events:none}
.ly svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ly-far {transform:translateZ(-2000px) scale(2.818)}
.ly-mid {inset:auto;left:-70%;top:-70%;width:240%;height:240%;transform:translateZ(-700px) scale(.818)}
/* characters are rendered at 2x and scaled down, so they stay sharp when the camera pushes in */
.ly-main,.ly-near{inset:auto;left:-70%;top:-70%;width:240%;height:240%}
.ly-main{transform:translateZ(0) scale(.5)}
.ly-near{transform:translateZ(380px) scale(.3275);filter:blur(4px)}
.ly-fg  {transform:translateZ(460px) scale(.582)}
.pc{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none}
.pc-far {transform:translateZ(-700px) scale(1.636)}
.pc-near{transform:translateZ(320px) scale(.709)}
.leak{position:absolute;inset:-100%;pointer-events:none;opacity:.14;transform:translateZ(150px) scale(.864)}
.leak::after{content:"";position:absolute;inset:0;animation:leak 20s ease-in-out infinite alternate;
  background:radial-gradient(circle 32vmax at 40% 41%,rgba(255,170,120,.9),transparent),radial-gradient(circle 26vmax at 61% 59%,rgba(255,120,170,.7),transparent)}
@keyframes leak{to{transform:translate3d(5%,-4%,0)}}
.vig{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.55) 100%)}
.shot.on .cam{animation:var(--cam,c-dollyIn) var(--dur,12s) cubic-bezier(.42,0,.3,1) both}
.hh{position:absolute;inset:0;transform-style:preserve-3d;animation:hh 6.5s ease-in-out infinite alternate}
@keyframes hh{0%{transform:translate3d(-.5%,.3%,0) rotateZ(-.35deg)}50%{transform:translate3d(.3%,-.4%,12px) rotateZ(.2deg)}100%{transform:translate3d(.5%,.2%,0) rotateZ(.35deg)}}
.shot.on .push{animation:pushIn 2.8s cubic-bezier(.2,.7,.3,1) both}
.shot.leaving .push{animation:pushOut 2.6s cubic-bezier(.55,0,.8,.5) both}
@keyframes pushIn{from{transform:translate3d(0,0,-160px)}to{transform:translate3d(0,0,0)}}
@keyframes pushOut{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,0,260px)}}
.ant.go{animation:antic 1.3s cubic-bezier(.4,0,.2,1) both}
@keyframes antic{0%{transform:translate3d(0,0,0) rotateX(0)}35%{transform:translate3d(0,.6%,-70px) rotateX(1.2deg)}100%{transform:translate3d(0,0,0) rotateX(0)}}
.foc{transition:transform 5.5s cubic-bezier(.45,.05,.2,1)}
#s1.arrived .shot[data-k="sky"] .foc{transform:translate3d(-12%,-24%,260px)}
#s1.bright .shot[data-k="sky"] .foc{transform:translate3d(0,0,0);transition-duration:7s}
/* phone portrait: let the wide artwork exist beyond the narrow frame so the camera can travel to it */
@media (max-aspect-ratio:4/5){
  .ly svg{overflow:visible}
  #s1.arrived .shot[data-k="sky"] .foc{transform:translate3d(-72%,-40%,260px)}
  #s1.bright .shot[data-k="sky"] .foc{transform:translate3d(0,0,0)}
  .shot[data-k="name"] .foc{transform:translate3d(0,-2%,-600px)}
}
/* camera moves: slow in, slow out, tiny settle at the end (overshoot then rest) */
@keyframes c-dollyIn{0%{transform:translate3d(0,0,-40px) rotateX(0) rotateY(0)}84%{transform:translate3d(0,0,250px) rotateX(0) rotateY(0)}92%{transform:translate3d(0,0,268px) rotateX(0) rotateY(0)}100%{transform:translate3d(0,0,262px) rotateX(0) rotateY(0)}}
@keyframes c-orbitL{0%{transform:translate3d(3%,0,30px) rotateX(1.5deg) rotateY(7deg)}84%{transform:translate3d(-3%,0,160px) rotateX(-1.2deg) rotateY(-5.5deg)}92%{transform:translate3d(-3.3%,0,168px) rotateX(-1.4deg) rotateY(-6.2deg)}100%{transform:translate3d(-3.2%,0,165px) rotateX(-1.3deg) rotateY(-6deg)}}
@keyframes c-orbitR{0%{transform:translate3d(-3%,0,30px) rotateX(1.5deg) rotateY(-7deg)}84%{transform:translate3d(3%,0,160px) rotateX(-1.2deg) rotateY(5.5deg)}92%{transform:translate3d(3.3%,0,168px) rotateX(-1.4deg) rotateY(6.2deg)}100%{transform:translate3d(3.2%,0,165px) rotateX(-1.3deg) rotateY(6deg)}}
@keyframes c-craneUp{0%{transform:translate3d(0,5%,0) rotateX(-5deg) rotateY(0)}84%{transform:translate3d(0,-2.5%,170px) rotateX(2deg) rotateY(0)}92%{transform:translate3d(0,-2.9%,180px) rotateX(2.4deg) rotateY(0)}100%{transform:translate3d(0,-2.8%,176px) rotateX(2.3deg) rotateY(0)}}
@keyframes c-craneDown{0%{transform:translate3d(0,-4%,0) rotateX(4deg) rotateY(-2deg)}84%{transform:translate3d(0,2%,180px) rotateX(-1.6deg) rotateY(1.6deg)}92%{transform:translate3d(0,2.3%,190px) rotateX(-1.9deg) rotateY(1.9deg)}100%{transform:translate3d(0,2.2%,186px) rotateX(-1.8deg) rotateY(1.8deg)}}
@keyframes c-truckR{0%{transform:translate3d(-5%,0,40px) rotateX(0) rotateY(-3deg)}84%{transform:translate3d(4.4%,0,150px) rotateX(0) rotateY(3deg)}92%{transform:translate3d(4.9%,0,158px) rotateX(0) rotateY(3.4deg)}100%{transform:translate3d(4.7%,0,155px) rotateX(0) rotateY(3.2deg)}}
@keyframes c-toCanvas{0%{transform:translate3d(2%,0,0) rotateX(0) rotateY(1.5deg)}84%{transform:translate3d(-10%,3.5%,230px) rotateX(0) rotateY(-2.5deg)}92%{transform:translate3d(-10.8%,3.8%,242px) rotateX(0) rotateY(-2.8deg)}100%{transform:translate3d(-10.5%,3.7%,238px) rotateX(0) rotateY(-2.7deg)}}
@keyframes c-pullBack{0%{transform:translate3d(0,0,300px) rotateX(0) rotateY(0)}84%{transform:translate3d(0,0,20px) rotateX(0) rotateY(0)}92%{transform:translate3d(0,0,4px) rotateX(0) rotateY(0)}100%{transform:translate3d(0,0,10px) rotateX(0) rotateY(0)}}
/* ===== anime film clips =====
   If clips/<name>.mp4 exists, it plays for that shot (over the drawn version). If not, the drawn version shows. */
.clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transition:opacity .6s}
.shot.hasvid .clip{opacity:1}
.shot.hasvid .push{visibility:hidden}
.shot.on.hasvid .clip{animation:clipDrift var(--dur,12s) cubic-bezier(.42,0,.3,1) both}
@keyframes clipDrift{from{transform:scale(1.04)}to{transform:scale(1.1)}}
.ov{position:absolute;inset:0;z-index:2;pointer-events:none;display:none;text-align:center}
.shot.hasvid .ov{display:block}
.ov .t{position:absolute;left:0;right:0;font-family:var(--serif);color:#FFF3D8;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.ov-name .big{top:30%;font-weight:800;font-size:clamp(56px,11vw,150px);opacity:0;filter:blur(12px);transform:scale(1.06);transition:all 3s cubic-bezier(.2,.7,.2,1) .5s}
#s1.named .ov-name .big{opacity:1;filter:none;transform:none}
.ov-name .mean{top:calc(30% + clamp(80px,14vw,190px));letter-spacing:.35em;font-size:clamp(16px,2.2vw,28px);opacity:0;transition:opacity 2s 3s}
#s1.named .ov-name .mean{opacity:.9}
.ov-name .dim{top:calc(30% + clamp(118px,19vw,250px));font-family:var(--hand);color:#FF9EB5;font-size:clamp(40px,6vw,80px);clip-path:inset(0 100% 0 0);transition:clip-path 2.6s steps(30,end)}
#s1.dimpoo .ov-name .dim{clip-path:inset(0 0 0 0)}
.ov-date .t{top:16%;letter-spacing:.5em;font-size:clamp(14px,1.8vw,24px);opacity:.85}
.ov-glug .t{top:36%;left:52%;right:auto;font-family:var(--hand);font-size:clamp(28px,4vw,52px);opacity:0;transform:scale(.4);transition:all .7s cubic-bezier(.2,1.6,.4,1) 1.1s}
#s2.fizz .ov-glug .t{opacity:1;transform:none}
/* ===== light & atmosphere (Shinkai cues: motivated single light source, bloom, crepuscular rays, anamorphic flare, layered haze) ===== */
.ly-light{transform:translateZ(-700px) scale(1.636)}
.ly-flare{transform:translateZ(620px) scale(.436);mix-blend-mode:normal}
.ly-haze{position:absolute;inset:-25%;pointer-events:none;transform:translateZ(-330px) scale(1.3)}
.ly-haze::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,var(--haze) 72%,transparent 100%);opacity:.55;animation:hazeDrift 26s ease-in-out infinite alternate}
@keyframes hazeDrift{from{transform:translate3d(-3%,0,0)}to{transform:translate3d(3%,-1.5%,0)}}
.bloomL{animation:bloomB 6s ease-in-out infinite alternate}
@keyframes bloomB{from{transform:scale(.94);opacity:.85}to{transform:scale(1.07);opacity:1}}
.raysL{animation:raysR 34s ease-in-out infinite alternate}
@keyframes raysR{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.raysL polygon{animation:shimmer 5s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.55}to{opacity:1}}
.ghost{animation:ghostB 8s ease-in-out infinite alternate}
@keyframes ghostB{from{opacity:.6}to{opacity:1}}
/* natural details */
.pend{transform-origin:1120px 40px;animation:pend 3.8s ease-in-out infinite}
@keyframes pend{0%,100%{transform:rotate(2.6deg)}50%{transform:rotate(-2.6deg)}}
.cshadow{animation:cshadow 38s linear infinite}
@keyframes cshadow{from{transform:translateX(-900px)}to{transform:translateX(1900px)}}
.blade{animation:blade 2.8s ease-in-out infinite alternate}
@keyframes blade{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.flick{animation:flickL .18s steps(2) infinite alternate}
@keyframes flickL{from{opacity:.75}to{opacity:1}}
/* opening title */
.hero{animation:heroP 3.2s ease-in-out infinite alternate}
@keyframes heroP{from{transform:scale(.85) rotate(0)}to{transform:scale(1.12) rotate(12deg)}}
#ttl{fill:transparent;stroke:#FFEBC2;stroke-width:1.4;stroke-dasharray:2600;stroke-dashoffset:2600;transition:stroke-dashoffset 4.2s ease .3s,fill 2.4s ease 3.4s}
#s1.title #ttl{stroke-dashoffset:0;fill:#FFF3D8}
#ttlSub{opacity:0;transition:opacity 2.4s ease 3.8s}
#s1.title #ttlSub{opacity:.85}
.ov-title .big{top:42%;font-weight:800;font-size:clamp(34px,6.4vw,96px);opacity:0;filter:blur(10px);transition:all 3s cubic-bezier(.2,.7,.2,1) .3s}
#s1.title .ov-title .big{opacity:1;filter:none}
.ov-title .sm{top:calc(42% + clamp(48px,8vw,120px));letter-spacing:.4em;font-size:clamp(12px,1.6vw,22px);color:#FFE7B8;opacity:0;transition:opacity 2s 3.5s}
#s1.title .ov-title .sm{opacity:.85}
@media (max-aspect-ratio:4/5){.shot[data-k="open"] .foc{transform:translate3d(0,-2%,-300px)}#ttl{font-size:38px}#ttlSub{font-size:13px;letter-spacing:2px}}
/* slide 3 */
.secret{animation:pulseH 1.6s ease-in-out infinite}
@keyframes pulseH{0%,100%{transform:scale(.9)}50%{transform:scale(1.1)}}
.qmark{opacity:0;transition:opacity .8s}
#s3.oblivious .qmark{opacity:.9;animation:wob 1s ease-in-out infinite alternate}
.eyeglint{opacity:0;transition:opacity .6s .4s}
#s3.eyes .eyeglint{opacity:1;animation:tw 1.2s ease-in-out infinite alternate}
.spark2 path{opacity:0}
#s3.eyes .spark2 path{animation:tw 1.4s ease-in-out infinite alternate}
#s3.tied .tie{stroke-dashoffset:0;transition:stroke-dashoffset 2.6s ease}
.tie{transition:none}
.walkers{animation:walkx 18s linear both}
@keyframes walkx{from{transform:translateX(-160px)}to{transform:translateX(200px)}}
.nickA,.nickB{opacity:0;transform:translateY(20px);transition:all 1s cubic-bezier(.2,1.4,.4,1)}
#s3.nick1 .nickA,#s3.nick2 .nickB{opacity:1;transform:none}
#s3.nick1 .nickA{animation:floatS 3s ease-in-out 1s infinite alternate}
@keyframes floatS{to{transform:translateY(-10px)}}
.bub2{opacity:0}
#s3.chat .bub2{animation:bubIn .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bubIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.msgOut,.typing,.msgIn{opacity:0}
#s3.sent .msgOut{animation:bubIn .7s cubic-bezier(.2,1.4,.4,1) forwards}
#s3.sent .typing{animation:typeOn 3.4s ease forwards 1s}
@keyframes typeOn{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
.dot{animation:dotB .9s ease-in-out infinite}
@keyframes dotB{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#s3.reply .typing{animation:none;opacity:0}
#s3.reply .msgIn{animation:bubIn .8s cubic-bezier(.2,1.4,.4,1) forwards}
.hburst path{opacity:0}
#s3.reply .hburst path{animation:burst 2.2s ease-out .6s forwards}
.notes2 text{animation:rise2 3s ease-in infinite;opacity:0}
@keyframes rise2{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(30px,-140px)}}
@keyframes c-povPush{0%{transform:translate3d(4%,1%,0) rotateX(0) rotateY(2deg)}86%{transform:translate3d(-14%,-4%,300px) rotateX(0) rotateY(-2deg)}93%{transform:translate3d(-15%,-4.3%,316px) rotateX(0) rotateY(-2.3deg)}100%{transform:translate3d(-14.7%,-4.2%,310px) rotateX(0) rotateY(-2.2deg)}}
@keyframes c-eyeIn{0%{transform:translate3d(0,0,-120px) rotateX(0) rotateY(0)}86%{transform:translate3d(0,0,300px) rotateX(0) rotateY(0)}93%{transform:translate3d(0,0,318px) rotateX(0) rotateY(0)}100%{transform:translate3d(0,0,312px) rotateX(0) rotateY(0)}}
.lid{transform:scaleY(0);animation:blink1 4.5s ease-in-out infinite}
@keyframes blink1{0%,46%,54%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
.pupil{transition:transform 2.4s cubic-bezier(.3,1.2,.5,1)}
#s3.eyes .pupil{transform:scale(1.35)}
.glint{animation:tw 2.2s ease-in-out infinite alternate}
.glint2{opacity:0}#s3.eyes .glint2{animation:tw 1s ease-in-out infinite alternate}
.refl{opacity:0;transition:opacity 2s ease 1.2s}#s3.eyes .refl{opacity:.55}
.note{transform:translateX(-160px) rotate(-8deg);opacity:0;transition:all 2s cubic-bezier(.3,1.1,.4,1)}
#s3.passnote .note{transform:none;opacity:1}
.hearts3 path{animation:rise2 3.4s ease-in infinite;opacity:0}
.umb{animation:umb 3s ease-in-out infinite alternate}
@keyframes umb{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bop{animation:bop .55s ease-in-out infinite alternate}
@keyframes bop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.twirl{animation:twirl 1.1s ease-in-out infinite alternate}
@keyframes twirl{0%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(0)}100%{transform:translateY(0) rotate(4deg)}}
.spots polygon{animation:spot 4s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes spot{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.sparkS path{animation:tw 1.3s ease-in-out infinite alternate}
.star3{animation:twirl 1.4s ease-in-out infinite alternate}
.solo{animation:soloP 3s ease-in-out infinite alternate}
@keyframes soloP{from{opacity:.16}to{opacity:.28}}
.kicker{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
#s3.kickoff .kicker{animation:kickL 3.2s ease-in-out .3s infinite}
@keyframes kickL{0%,70%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(10deg)}}
.cheerH path{opacity:0}
#s3.cheer .cheerH path{animation:rise2 2.6s ease-in infinite}
.dupatta{transform-origin:772px 456px;animation:dup 2.4s ease-in-out infinite alternate}
@keyframes dup{from{transform:skewY(-4deg) scaleX(.92)}to{transform:skewY(5deg) scaleX(1.06)}}
.realH{opacity:0;transform:scale(.3)}
#s3.realise .realH{opacity:1;transform:none;transition:all 1.4s cubic-bezier(.2,1.6,.4,1);animation:pulseH 1.2s ease-in-out 1.4s infinite}
.flash{opacity:0}
#s4.thunder .flash{animation:flash 6s ease-out 1.2s infinite}
@keyframes flash{0%,8%,100%{opacity:0}2%{opacity:.55}4%{opacity:.1}6%{opacity:.4}}
.bowed{transform:rotate(-3deg)}
.cloudL,.cloudR{transition:transform 6s cubic-bezier(.3,0,.2,1)}
#s4.rising .cloudL{transform:translateX(-420px)}#s4.rising .cloudR{transform:translateX(420px)}
.sunUp{transform:translateY(160px) scale(.8);transition:transform 7s cubic-bezier(.3,0,.2,1)}
#s4.rising .sunUp{transform:none}
.bloomUp{transform-origin:800px 760px;transform:scaleY(0);transition:transform 4s cubic-bezier(.3,1.2,.5,1) 2s}
#s4.rising .bloomUp{transform:scaleY(1)}
.standUp{transform:translateY(60px) scaleY(.7);opacity:.6;transition:all 3s cubic-bezier(.3,1.1,.4,1) .6s}
#s4.rising .standUp{transform:none;opacity:1}
.armsUp{animation:breathe 4s ease-in-out infinite}
.fl{animation:tw 1.4s ease-in-out infinite alternate}
.ghosts{opacity:0;transition:opacity 4s ease}
#s5.ghostsIn .ghosts{opacity:1}
.lan{opacity:0}
.lanA .lan,.lanB .lan,.lanC .lan{animation:none}
#s5.l1 .lanA .lan,#s5.l2 .lanB .lan,#s5.l3 .lanC .lan{animation:lanUp 16s linear infinite}
@keyframes lanUp{0%{opacity:0;transform:translate(0,0)}8%{opacity:1}100%{opacity:0;transform:translate(var(--x),-620px)}}
.pframe{opacity:0;transform:scale(.85) rotate(-4deg);transition:all 2.6s cubic-bezier(.2,1.1,.3,1)}
#s5.reveal .pframe{opacity:1;transform:rotate(-1.5deg);animation:floatS 5s ease-in-out 2.6s infinite alternate}
#hbd{fill:transparent;stroke:#FFEBC2;stroke-width:1.6;stroke-dasharray:3200;stroke-dashoffset:3200;transition:stroke-dashoffset 4.5s ease .3s,fill 2.4s ease 3.6s}
#s5.hbd #hbd{stroke-dashoffset:0;fill:#FFF3D8}
#hbd2{opacity:0;transition:opacity 2s ease 4.4s}#s5.hbd #hbd2{opacity:1}
@media (max-aspect-ratio:4/5){#hbd{font-size:29px}#hbd2{font-size:21px}.shot[data-k="finale"] .foc{transform:translate3d(0,0,-200px)}}
/* memories */
.ly-mem{transform:translateZ(0)}
@media (max-aspect-ratio:4/5){.memFrame img,.memFrame video{max-height:46svh;max-width:70vw}.memStage{padding-bottom:calc(var(--bar) + 22vh)}}
.memBg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(34px) brightness(.55) saturate(1.3);transform:scale(1.15)}
.memStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--bar) + 7vh) 6vw calc(var(--bar) + 15vh)}
.memFrame{position:relative;background:#FFF8EE;padding:12px 12px 12px;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(255,220,180,.18);
  transform:rotate(var(--t)) scale(.94);opacity:0;transition:transform 2.2s cubic-bezier(.2,1,.3,1),opacity 1.2s ease;max-height:100%;max-width:100%;display:flex}
.shot.on .memFrame{opacity:1;transform:rotate(calc(var(--t) * .6)) scale(1)}
.memFrame img,.memFrame video{display:block;max-height:calc(100vh - 2*var(--bar) - 40vh);max-height:calc(100svh - 2*var(--bar) - 40vh);max-width:66vw;border-radius:8px;object-fit:contain}
.shot.on .memFrame img{animation:memKB 10s ease-out both}
@keyframes memKB{from{transform:scale(1.0)}to{transform:scale(1.04)}}
.memFrame{overflow:hidden}
/* living characters */
.alive{transform-origin:0 0;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.02)}}
.head{animation:tilt 6.5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.9deg)}}
.hair{animation:hairlag 6.5s ease-in-out infinite;animation-delay:.35s}
@keyframes hairlag{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-3deg)}}
.pallu{animation:hairlag 4.2s ease-in-out infinite;animation-delay:.4s}
.fhead{animation:fh 3.6s ease-in-out infinite alternate}

.swing .lag{transform-origin:690px 600px;animation:lagsw 4.5s ease-in-out infinite;animation-delay:.35s}

.mb{animation:mb 7s ease-in-out infinite alternate}
@keyframes mb{from{transform:scale(.93)}to{transform:scale(1.08)}}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:8}

@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-4%,3%)}66%{transform:translate(3%,-4%)}100%{transform:translate(0,0)}}
.sub{position:absolute;left:50%;bottom:calc(var(--bar) + 3.5vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,1000px);text-align:center;z-index:9;pointer-events:none;min-height:3.2em}
.sub p{position:absolute;left:0;right:0;bottom:0;font-weight:700;font-size:clamp(19px,2.6vw,32px);line-height:1.5;
  text-shadow:0 2px 6px rgba(0,0,0,.75),0 0 26px rgba(0,0,0,.55);opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity 1.4s ease,transform 1.4s ease,filter 1.4s ease}

.replay:focus-visible,#start:focus-visible{outline:3px solid #FFD98A;outline-offset:3px}
.cloudDrift{animation:cdrift 70s linear infinite alternate}
@keyframes cdrift{to{transform:translateX(-120px)}}
.rays2{transform-origin:420px 470px;animation:rays2 30s linear infinite alternate}
@keyframes rays2{to{transform:rotate(6deg)}}
.sway{animation:sway 3.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.bfly{animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.25)}}
.drops circle{animation:drop 1.2s ease-in infinite;opacity:0}
@keyframes drop{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,90px)}}
.rays3{transform-origin:1330px 140px;animation:rays3 26s linear infinite alternate}
@keyframes rays3{to{transform:rotate(-5deg)}}
.tree{transform-origin:167px 640px;animation:treesway 7s ease-in-out infinite alternate}
@keyframes treesway{to{transform:rotate(.8deg)}}
.cue{position:absolute;left:50%;bottom:calc(var(--bar) * .3);transform:translateX(-50%);z-index:10;font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity 1s;color:#bbb}
.slide.done .cue{opacity:.8}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;transition:opacity 1.4s,visibility 1.4s;text-align:center;padding:24px}
#intro.gone{opacity:0;visibility:hidden}

@keyframes tw{from{opacity:.2}to{opacity:1}}
.float{animation:float 7s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-14px)}}
.steam path{stroke:rgba(255,240,220,.6);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:70;animation:steam 3s linear infinite;opacity:0}

/* ---------- slide 1 ---------- */
#s1 .wn{fill:#1C1B3E;transition:fill 1.4s ease}
#s1.bright .wn{fill:#FFD98A}

#s1.bright .warm{opacity:1}

.dust circle{animation:dust 6s ease-in-out infinite alternate}
@keyframes dust{0%{opacity:.1;transform:translateY(0)}100%{opacity:1;transform:translateY(-30px)}}
#spark{opacity:0;transform-origin:912px 535px;transform:scale(0) rotate(-40deg);transition:all 1.2s cubic-bezier(.2,1.6,.4,1) .4s}

.rimc{opacity:.9}

@keyframes babyBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.014)}}
#s1.dimple .babybob{animation:squash 1s cubic-bezier(.3,1.5,.5,1) 1,babyBreath 3.4s ease-in-out 1s infinite}
@keyframes squash{0%{transform:scale(1,1)}22%{transform:scale(1.05,.94)}52%{transform:scale(.97,1.05)}78%{transform:scale(1.012,.99)}100%{transform:scale(1,1)}}
.blinkL{transform-origin:748px 470px;animation:blink 4s infinite}.blinkR{transform-origin:852px 470px;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eyesHappy,.mouthO,.dimpleMark,.minihrt{opacity:0;transition:opacity .5s}
#s1.dimple .eyesHappy,#s1.dimple .mouthO{opacity:1}#s1.dimple .eyesOpen,#s1.dimple .mouthC{opacity:0}
.eyesOpen,.mouthC{transition:opacity .4s}

#s1.dimpoo #heart{opacity:1;transform:scale(1)}

/* ---------- slide 2 ---------- */
.swing{transform-origin:690px -40px;animation:swing 4.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(1.3deg)}50%{transform:rotate(-1.3deg)}}
.lampglow{animation:flick 2.6s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.8}50%{opacity:1}100%{opacity:.9}}
#duskLayer{opacity:0;transition:opacity 4s ease}
#s2.dusk #duskLayer{opacity:1}
#duskStars{opacity:0;transition:opacity 4s ease 1s}
#s2.dusk #duskStars{opacity:1}
.flame{animation:flame .3s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
@keyframes flame{to{transform:scaleY(1.15) scaleX(.92)}}
#stream{stroke-dasharray:140;stroke-dashoffset:140;transition:stroke-dashoffset 1.6s ease .6s}
#s2.pour #stream{stroke-dashoffset:0}
#cupSteam{opacity:0;transition:opacity 1s ease 2s}
#s2.pour #cupSteam{opacity:1}
.bub{opacity:0}
#s2.sisters .bub{animation:bub 2.2s ease-out infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.bottle{transition:transform 1s cubic-bezier(.2,1.4,.4,1)}
#s2.sisters .bottle{transform:translateY(-14px) rotate(var(--tilt))}
.drink{transform-origin:818px 530px;transform:rotate(72deg);transition:transform 1.2s cubic-bezier(.3,1.25,.5,1)}
#s2.fizz .drink{transform:rotate(0deg);animation:gulp 1.1s ease-in-out 1.3s infinite alternate}
@keyframes gulp{from{transform:rotate(0deg)}to{transform:rotate(-6deg)}}
.glugb{opacity:0}#s2.fizz .glugb{animation:bub 1.4s ease-out 1.3s infinite}
.glug{opacity:0;transform-origin:1000px 430px;transform:scale(.4);transition:all .7s cubic-bezier(.2,1.6,.4,1) 1.1s}
#s2.fizz .glug{opacity:1;transform:scale(1);animation:wob 1s ease-in-out 2s infinite alternate}
@keyframes wob{to{transform:rotate(-4deg) translateY(-6px)}}
.lights circle{animation:tw 1.6s ease-in-out infinite alternate}
.dab{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;transition:all .6s cubic-bezier(.2,1.6,.4,1)}
#s2.paint1 .dab{opacity:1;transform:scale(1)}
#brush{transform-origin:720px 572px;transition:transform .8s}
#s2.paint2 #brush{animation:brush .9s ease-in-out infinite alternate}
@keyframes brush{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.stroke{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l,900);stroke-dashoffset:var(--l,900)}
#s2.paint2 .stroke{transition:stroke-dashoffset 1.6s ease var(--d,0s);stroke-dashoffset:0}
.bloom{transform:scale(0);opacity:0;transform-box:fill-box;transform-origin:center}
#s2.blooming .bloom{animation:bloom 5.5s cubic-bezier(.25,.8,.25,1) forwards;animation-delay:calc(var(--d) + .45s)}
@keyframes bloom{0%{transform:scale(0);opacity:0}30%{opacity:.75}100%{transform:scale(1);opacity:.6}}
.rise{opacity:0}
#s2.blooming .rise{animation:rise 7s ease-in infinite;animation-delay:var(--d)}
@keyframes rise{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-700px) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.cam,.push,.ant,.foc,.hh{animation:none!important;transform:none!important}.shot{transition:opacity 1.2s ease!important}}
/* --- improvements: controls, mobile, performance --- */
#controls{position:fixed;left:16px;top:calc(var(--bar) + 12px);z-index:20;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 10px;font-family:var(--serif);font-size:13px}
#controls{opacity:.35;transition:opacity .4s}#controls:hover,#controls:focus-within,#controls.wake{opacity:1}
#controls button:disabled{opacity:.35;cursor:default}
#controls button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--serif);font-size:13px}
#controls button:focus-visible{outline:3px solid #FFD98A;outline-offset:2px}
#progressWrap{width:90px;height:6px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#progressFill{height:100%;width:0;background:#FFD98A}
#soundNote{color:#FFD98A}
.grain{animation:none}
.slide.active .grain{animation:grain 1s steps(6) infinite}
.shot:not(.on):not(.leaving) *,.slide.paused *{animation-play-state:paused !important}
@media (max-width:640px){
  .sub{bottom:calc(var(--bar) + 13vh)}
  .sub p{font-size:17px;line-height:1.45}
  #controls{left:10px;right:10px;top:calc(var(--bar) + 8px);justify-content:center;flex-wrap:wrap}
  #progressWrap{width:70px}
}
/* --- Shinkai presentation: grade, light, stills --- */
.shot.on.hasvid::before,.shot.on.hasimg::before{
  content:""; position:absolute; inset:-20%; z-index:4; pointer-events:none; opacity:.14;
  background:repeating-conic-gradient(from 0deg at 50% 30%, rgba(255,240,200,.35) 0deg 2deg, transparent 2deg 10deg);
  animation:shinkaiRays 40s linear infinite alternate;
}
@keyframes shinkaiRays{to{transform:rotate(3deg) translateX(2%)}}
.shot.on::after{
  content:""; position:absolute; inset:0; z-index:5; pointer-events:none; opacity:.35;
  background:linear-gradient(180deg, rgba(255,180,120,.18), transparent 45%, rgba(20,10,60,.22));
}
.still{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; opacity:0; transition:opacity .6s}
.shot.hasimg .still{opacity:1}
.shot.hasimg .push{visibility:hidden}
.shot.on.hasimg .still{animation:stillDrift var(--dur,12s) cubic-bezier(.42,0,.3,1) both}
@keyframes stillDrift{from{transform:scale(1.02)} to{transform:scale(1.12) translateY(-1%)}}
.shot.hasvid .clip, .shot.hasimg .still{
  filter:saturate(1.22) contrast(1.06) brightness(1.03);
}
.shot.hasvid .leak, .shot.hasimg .leak{opacity:.30}
.shot.hasimg .ov{display:block}
.navArrow{position:fixed;top:50%;transform:translateY(-50%);z-index:25;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.35);color:#fff;font-size:30px;line-height:1;cursor:pointer;display:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.navArrow:focus-visible{outline:3px solid #FFD98A;outline-offset:3px}
#sidePrev{left:12px}#sideNext{right:12px}
body.playing .navArrow{display:block}
.navArrow[disabled]{opacity:0;pointer-events:none}
</style>

<body>
<div id="intro"><h1>Poonam</h1><p>3 November · sound on · full screen if you can</p>
  <div id="gWait" hidden><div id="gCount" style="font-size:clamp(40px,9vw,80px);letter-spacing:.06em;font-variant-numeric:tabular-nums">--:--:--</div><p>Opens at midnight, 3 November</p></div>

    <div id="gErr" role="alert" style="min-height:20px;color:#FF9AA5;font-size:14px"></div><button id="gOk" style="background:#E2263A;color:#fff;border:none;border-radius:999px;padding:12px 30px;font-family:inherit;font-size:16px;cursor:pointer">Open</button></div>

<script>
/* =================== silhouette kit =================== */
const SIL="#22102A";
const R=Math.random;
const RIM=`<filter id="rim" x="-10%" y="-10%" width="120%" height="120%"><feOffset in="SourceAlpha" dx="-5" dy="2" result="o"/><feComposite in="SourceAlpha" in2="o" operator="out" result="e"/><feGaussianBlur in="e" stdDeviation=".6" result="eb"/><feFlood flood-color="#FFD7A0" flood-opacity=".9"/><feComposite in2="eb" operator="in" result="r"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="r"/></feMerge></filter>
<radialGradient id="cloudG" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#FFF6EE"/><stop offset=".6" stop-color="#FFD9CC"/><stop offset="1" stop-color="#E6A8B8" stop-opacity=".0"/></radialGradient>
<filter id="soft6"><feGaussianBlur stdDeviation="6"/></filter>`;
/* Each shot is split into depth layers with <!--L:mid-->, <!--L:main-->, <!--L:near--> markers.
   Content before the first marker is the far layer. Every layer is its own SVG placed at a real 3D depth. */
const ALLDEFS=new Set();
const svg=(inner,defs="")=>{
  ALLDEFS.add(RIM);ALLDEFS.add(defs);
  const parts={far:"",mid:"",main:"",near:""};let cur="far";
  inner.split(/<!--L:(mid|main|near)-->/).forEach((chunk,i)=>{if(i%2)cur=chunk;else parts[cur]+=chunk});
  return Object.entries(parts).filter(([k,v])=>v.trim()).map(([k,v])=>`<div class="ly ly-${k}"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${RIM}${defs}</defs>${v}</svg></div>`).join("");
};
/* soft volumetric cloud: lit top, shaded bottom */
const cloud=(x,y,w,o=.85)=>`<g opacity="${o}" filter="url(#soft6)" class="cloudDrift" style="animation-duration:${60+((x*7)%40)}s">${[[0,0,1],[-.32,.12,.7],[.34,.1,.75],[-.14,-.12,.62],[.16,-.14,.58]].map(([dx,dy,r])=>`<ellipse cx="${x+dx*w}" cy="${y+dy*w*.5}" rx="${w*.36*r}" ry="${w*.2*r}" fill="url(#cloudG)"/>`).join("")}</g>`;
const RIMG=(inner,c=SIL)=>`<g class="rimc" transform="translate(-3.2 1.4)">${inner}</g><g fill="${c}">${inner}</g>`;
const g=(x,y,s,inner,c=SIL,extra="")=>{const d=(R()*4).toFixed(2);return `<g transform="translate(${x} ${y}) scale(${s})" ${extra}><g class="alive" style="animation-delay:-${d}s">${RIMG(inner,c)}</g></g>`};
const HD=(oy,inner)=>`<g class="head" style="transform-origin:0px ${oy}px;animation-delay:-${(R()*6).toFixed(2)}s">${inner}</g>`;
function woman(x,y,s,o={}){
  const F=o.f||1;
  let p=HD(-206,`<circle cx="0" cy="-232" r="26"/><circle cx="${o.f<0?-21:21}" cy="-244" r="11"/>`)+`
  <path d="M-28 -202 Q0 -214 28 -202 L44 -60 Q50 0 40 0 L-40 0 Q-50 0 -44 -60Z"/>
  <g class="pallu" style="transform-origin:${18*F}px -196px"><path d="M${28*F} -202 Q${54*F} -150 ${44*F} -80 L${34*F} -80 Q${40*F} -140 ${18*F} -188Z"/></g>`;
  if(o.baby)p+=`<path d="M-20 -180 Q10 -150 46 -176 L50 -164 Q12 -132 -24 -166Z"/><ellipse cx="14" cy="-170" rx="38" ry="19" fill="#5C3656"/><circle cx="46" cy="-178" r="12" fill="#5C3656"/>`;
  if(o.pour)p+=`<path d="M-20 -196 L-86 -232 L-80 -242 L-14 -208Z"/><rect x="-140" y="-252" width="54" height="16" rx="5"/><rect x="-92" y="-248" width="16" height="6"/>`;
  return g(x,y,s,p,o.c);
}
function man(x,y,s,o={}){

/* =================== moon phases =================== */
function phasePath(cx,cy,r,p){
  p=((p%1)+1)%1;const k=Math.cos(2*Math.PI*p),rx=Math.abs(k)*r;
  if(p<.5)return `M${cx} ${cy-r} A${r} ${r} 0 0 1 ${cx} ${cy+r} A${rx} ${r} 0 0 ${k>0?0:1} ${cx} ${cy-r}Z`;
  return `M${cx} ${cy-r} A${r} ${r} 0 0 0 ${cx} ${cy+r} A${rx} ${r} 0 0 ${k>0?1:0} ${cx} ${cy-r}Z`;
}
function runPhases(){
  const lit=document.getElementById("moonLit"),mt=document.getElementById("monthTxt"),M=["February","March","April","May","June","July","August","September","October","November"];
  const dur=4400*PACE,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,2),p=.02+e*8.48;lit.setAttribute("d",phasePath(800,400,140,p));mt.textContent=M[Math.min(9,Math.floor(e*9.99))];if(k<1)requestAnimationFrame(f)})(t0);
}

  {const c=currentSlide();document.getElementById("prevBtn").disabled=document.getElementById("sidePrev").disabled=c<=0;document.getElementById("nextBtn").disabled=document.getElementById("sideNext").disabled=c>=FILM.length-1;}
  progressFill.style.width=Math.min(100,el/(f.end*PACE)*100)+"%";slideLabel.textContent="Slide "+(playingSlide+1)+" of "+FILM.length;
  if(!isPaused)requestAnimationFrame(tickProgress);
}
function togglePause(){
  if(playingSlide<0)return;
  const sec=document.getElementById(FILM[playingSlide].el);
  if(!isPaused){isPaused=true;pauseStarted=performance.now();pauseTimers(playingSlide);vo.pause();if("speechSynthesis" in window)speechSynthesis.pause();sec.style.setProperty("--ps","paused");sec.classList.add("paused");sec.querySelectorAll(".clip,video.memv").forEach(v=>v.pause());document.getElementById("music").pause();pauseBtn.textContent="Play"}
  else{isPaused=false;pausedTotal+=performance.now()-pauseStarted;resumeTimers(playingSlide);sec.classList.remove("paused");sec.querySelectorAll(".shot.on.hasvid .clip,.shot.on video.memv").forEach(v=>v.play().catch(()=>{}));document.getElementById("music").play().catch(()=>{});if(soundOn)vo.play().catch(()=>{});if("speechSynthesis" in window)speechSynthesis.resume();pauseBtn.textContent="Pause";tickProgress()}
}
function toggleMute(){vo.muted=!vo.muted;document.getElementById("music").muted=vo.muted;TTS.muted=vo.muted;if(vo.muted&&"speechSynthesis" in window)speechSynthesis.cancel();muteBtn.textContent=vo.muted?"Unmute":"Mute"}
let wakeT;document.addEventListener("pointerdown",()=>{const c=document.getElementById("controls");c.classList.add("wake");clearTimeout(wakeT);wakeT=setTimeout(()=>c.classList.remove("wake"),3000)});
function currentSlide(){const i=FILM.findIndex(f=>Math.abs(document.getElementById(f.el).getBoundingClientRect().top)<innerHeight*.5);return i<0?0:i}
document.getElementById("nextBtn").onclick=()=>goSlide(currentSlide()+1);
document.getElementById("sideNext").onclick=()=>goSlide(currentSlide()+1);
document.getElementById("sidePrev").onclick=()=>goSlide(currentSlide()-1);
document.getElementById("prevBtn").onclick=()=>goSlide(currentSlide()-1);
pauseBtn.onclick=togglePause;muteBtn.onclick=toggleMute;
document.getElementById("replayBtn").onclick=()=>{const vis=FILM.findIndex(f=>Math.abs(document.getElementById(f.el).getBoundingClientRect().top)<innerHeight*.5);play(vis<0?0:vis)};
document.addEventListener("keydown",e=>{
  if(!soundOn)return;
  if(e.code==="Space"){e.preventDefault();togglePause()}
  if(e.key==="m"||e.key==="M")toggleMute();
  if(e.key==="ArrowRight")nextScene();
  if(e.key==="ArrowDown")goSlide(curSlide()+1);
  if(e.key==="ArrowUp"||e.key==="ArrowLeft")goSlide(Math.max(0,curSlide()-1));
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playingSlide>=0&&!isPaused)togglePause()});
function play(i,fromBase=0){
  const f=FILM[i],sec=document.getElementById(f.el);
  if(playingSlide>=0&&playingSlide!==i)clearTimers(playingSlide);
  clearTimers(i);
  sec.className="slide bars active";
  document.querySelectorAll(".slide").forEach(s=>{if(s!==sec)s.classList.remove("active")});
  sec.querySelector(".sub").innerHTML="";
  sec._seen={};sec.querySelectorAll(".shot").forEach(s=>s.classList.remove("on","leaving","pre"));sec.querySelectorAll(".ant").forEach(a=>a.classList.remove("go"));
  const realFrom=fromBase*PACE;
  playingSlide=i;isPaused=false;pausedTotal=0;slideStart=performance.now()-realFrom;pauseBtn.textContent="Pause";sec.classList.remove("paused");
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(false){vo.pause();vo.src=f.audio;const seek=()=>{try{vo.currentTime=realFrom/1000}catch(e){}};if(vo.readyState>=1)seek();else vo.addEventListener("loadedmetadata",seek,{once:true});vo.play().catch(()=>{})}
  const shotT=f.tl.filter(([t,a])=>a.shot).map(([t])=>t).concat([f.end]);
  /* jumping in mid-slide: apply everything that already happened, instantly */
  let lastShot=null,lastLine=null;
  f.tl.forEach(([t,a])=>{if(t*PACE>=realFrom)return;if(a.shot)lastShot=[t,a.shot];if(a.line)lastLine=a.line;if(a.cue&&a.cue!=="phases")sec.classList.add(a.cue);if(a.cue==="falling")try{document.getElementById("fall").beginElement()}catch(e){}});
  if(lastShot){const nx=shotT.find(x=>x>lastShot[0]);showShot(sec,lastShot[1],((nx||f.end)*PACE-realFrom)+2600)}
  if(lastLine)showLine(sec,lastLine);
  f.tl.forEach(([t,a])=>{if(t*PACE<realFrom)return;schedule(i,t*PACE-realFrom,()=>{
    if(a.shot){const nx=shotT.find(x=>x>t);showShot(sec,a.shot,((nx||f.end)-t)*PACE+2600)}
    if(a.line)showLine(sec,a.line);
    if(a.cue){
      if(["falling","named","blooming"].includes(a.cue)){const an=sec.querySelector(".shot.on .ant");if(an){an.classList.remove("go");void an.offsetWidth;an.classList.add("go")}}
      if(a.cue==="falling")setTimeout(()=>{sec.classList.add("falling");document.getElementById("fall").beginElement()},450);
      else sec.classList.add(a.cue);
      if(a.cue==="phases")runPhases();
      if(a.cue==="kickoff")setTimeout(()=>{try{document.getElementById("kick").beginElement()}catch(e){}},700);
    }
  })});
  schedule(i,f.end*PACE-realFrom,()=>{
    sec.classList.add("done");playingSlide=-1;progressFill.style.width="100%";
    if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    if(Math.abs(sec.getBoundingClientRect().top)>innerHeight*.5)return;
    const nx=document.getElementById(FILM[i+1]?FILM[i+1].el:"");
    if(nx)document.getElementById("deck").scrollTo({top:nx.offsetTop,behavior:"smooth"});
  });
  played[i]=true;tickProgress();
}
document.querySelectorAll(".replay").forEach(b=>b.onclick=()=>play(+b.dataset.s));
/* ---------- skip / next / previous ---------- */
function curSlide(){if(playingSlide>=0)return playingSlide;const v=FILM.findIndex(f=>Math.abs(document.getElementById(f.el).getBoundingClientRect().top)<innerHeight*.5);return v<0?0:v}
function goSlide(i){if(i<0||i>=FILM.length)return;const c=curSlide();clearTimers(c);if(playingSlide>=0)playingSlide=-1;vo.pause();if("speechSynthesis" in window)speechSynthesis.cancel();isPaused=false;document.querySelectorAll(".slide.paused").forEach(x=>x.classList.remove("paused"));
  const deck=document.getElementById("deck"),el=document.getElementById(FILM[i].el);deck.style.scrollBehavior="auto";deck.scrollTop=el.offsetTop;deck.style.scrollBehavior="";play(i)}
function nextScene(){const i=curSlide(),f=FILM[i];if(playingSlide<0){goSlide(i+1);return}
  const now=isPaused?pauseStarted:performance.now(),elapsed=(now-slideStart-pausedTotal)/PACE;
  const nx=f.tl.find(([t,a])=>a.shot&&t>elapsed+300);
  if(nx)play(i,nx[0]);else goSlide(i+1)}
document.getElementById("nextBtn").onclick=()=>goSlide(curSlide()+1);
document.getElementById("prevBtn").onclick=()=>{const i=curSlide();goSlide(i>0?i-1:0)};
document.getElementById("sceneBtn").onclick=nextScene;
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting||!soundOn)return;
  const i=FILM.findIndex(f=>f.el===e.target.id);
  if(played[i])return;
  if(playingSlide!==-1&&playingSlide!==i)return;
  play(i);
}),{threshold:.6});
/* ---------- midnight IST lock + birthday password (add ?preview to the URL to test early) ---------- */
(function(){
  const UNLOCK=new Date("2026-11-03T00:00:00+05:30").getTime(),PW=["03111998","031198","11031998","3111998"];
  const preview=new URLSearchParams(location.search).has("preview");
  const $=id=>document.getElementById(id),show=id=>{["gWait","gPw","start"].forEach(x=>$(x).hidden=x!==id);if(id==="gPw")$("gPw").style.display="flex";else $("gPw").style.display="none"};
  function tick(){const left=UNLOCK-Date.now();if(left<=0||preview){clearInterval(t);show("gPw");return}
    const h=Math.floor(left/36e5),m=Math.floor(left%36e5/6e4),sec=Math.floor(left%6e4/1e3);$("gCount").textContent=[h,m,sec].map(n=>String(n).padStart(2,"0")).join(":");show("gWait")}
  const t=setInterval(tick,1000);tick();
  function tryIt(){const v=$("gIn").value.replace(/\D/g,"");if(!v){$("gErr").textContent="Enter your birthdate.";return}
    if(!PW.includes(v)){$("gErr").textContent="Not quite. Day, month, then year.";return}show("start");$("start").focus()}
  $("gOk").onclick=tryIt;$("gIn").addEventListener("keydown",e=>{if(e.key==="Enter")tryIt()});$("gIn").addEventListener("input",()=>$("gErr").textContent="");
})();
document.getElementById("start").onclick=()=>{soundOn=true;{const m=document.getElementById("music");m.volume=.55;m.play().catch(()=>{})}document.body.classList.add("playing");if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}document.getElementById("intro").classList.add("gone");play(0);document.querySelectorAll(".slide").forEach(s=>io.observe(s))};
